<div id="expenses-breakdown-card" class="card h-100 shadow-sm border-0">
    <div class="card-header bg-transparent border-0 pt-3 pb-0">
        <h6 class="text-uppercase text-muted fw-bold mb-0" style="font-size: 0.75rem; letter-spacing: 0.05em;">Expenses Breakdown</h6>
    </div>
    <div class="card-body d-flex flex-column" style="position: relative; height: 620px;">
        <div style="width: 100%; height: 350px; position: relative;">
            <canvas id="expensesBreakdownChart"></canvas>
        </div>
        <div class="mt-3 flex-grow-1" style="overflow-y: auto;">
            <ul id="categoryList" class="list-unstyled mb-0">
                <li class="text-center text-muted py-2">Loading...</li>
            </ul>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    let breakdownChartInstance = null;
    const colorPalette = [
        '#3B82F6', '#10B981', '#F59E0B', '#EF4444', 
        '#8B5CF6', '#F97316', '#6B7280', '#EC4899'
    ];
    
    window.fetchAndRenderBreakdown = function (year, month) {
        const query = (year && month) ? `?year=${year}&month=${month}` : '';
        fetch(`/dashboard/expenses-breakdown${query}`)
            .then(response => response.json())
            .then(data => {
                // Render chart
                const ctx = document.getElementById('expensesBreakdownChart').getContext('2d');
                if (breakdownChartInstance) breakdownChartInstance.destroy();
                breakdownChartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            data: data.data,
                            backgroundColor: colorPalette,
                            borderWidth: 0,
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        layout: {
                            padding: 10
                        }
                    }
                });
                
                // Render category list
                const categoryList = document.getElementById('categoryList');
                if (data.labels && data.labels.length > 0) {
                    categoryList.innerHTML = data.labels.map((label, index) => `
                        <li class="d-flex justify-content-between align-items-center py-2">
                            <div class="d-flex align-items-center">
                                <span class="rounded-circle me-2" style="width: 12px; height: 12px; background-color: ${colorPalette[index % colorPalette.length]}; display: inline-block;"></span>
                                <span class="fw-medium">${label}</span>
                            </div>
                            <span class="text-dark fw-bold">$${Number(data.data[index]).toLocaleString()}</span>
                        </li>
                    `).join('');
                } else {
                    categoryList.innerHTML = '<li class="text-center text-muted py-2">No data available</li>';
                }
            });
    };
</script>
