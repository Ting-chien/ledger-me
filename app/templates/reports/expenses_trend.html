<div class="card h-100 shadow-sm border-0">
    <div class="card-header bg-transparent border-0 pt-3 pb-0">
        <h6 class="text-uppercase text-muted fw-bold mb-0" style="font-size: 0.75rem; letter-spacing: 0.05em;">
            Expenses Trend
        </h6>
    </div>
    <div class="card-body" style="position: relative; min-height: 300px;">
        <canvas id="expenseBarChart"></canvas>
    </div>
</div>
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    let chartInstance = null;
    window.fetchAndRenderTrend = function (year, month) {
        const query = (year && month) ? `?year=${year}&month=${month}` : '';
        fetch(`/reports/expenses-trend${query}`)
            .then((resp) => resp.json())
            .then((data) => {
                const ctx = document
                    .getElementById("expenseBarChart")
                    .getContext("2d");
                if (chartInstance) chartInstance.destroy();
                chartInstance = new Chart(ctx, {
                    type: "bar",
                    data: {
                        labels: data.labels,
                        datasets: [
                            {
                                label: "Daily Expenses",
                                data: data.data,
                                backgroundColor: "#3B82F6",
                                borderRadius: 4,
                                barPercentage: 0.6,
                            },
                        ],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                padding: 12,
                                cornerRadius: 8
                            }
                        },
                        scales: {
                            x: { 
                                grid: { display: false },
                                ticks: { font: { size: 11 } }
                            },
                            y: {
                                beginAtZero: true,
                                grid: { borderDash: [2, 4], color: '#f0f0f0' },
                                border: { display: false }
                            },
                        },
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                    },
                });
            });
    };
</script>
{% endblock %}
