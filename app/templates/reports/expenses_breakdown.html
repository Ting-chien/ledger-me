<div id="expenses-breakdown-card" class="card h-100 shadow-sm border-0">
    <div class="card-header bg-transparent border-0 pt-3 pb-0">
        <h6 class="text-uppercase text-muted fw-bold mb-0" style="font-size: 0.75rem; letter-spacing: 0.05em;">Expenses Breakdown</h6>
    </div>
    <div class="card-body d-flex flex-column justify-content-center align-items-center" style="position: relative; min-height: 300px;">
        <div style="width: 100%; height: 100%; position: relative;">
            <canvas id="expensesBreakdownChart"></canvas>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    let breakdownChartInstance = null;
    window.fetchAndRenderBreakdown = function (year, month) {
        const query = (year && month) ? `?year=${year}&month=${month}` : '';
        fetch(`/reports/expenses-breakdown${query}`)
            .then(response => response.json())
            .then(data => {
                const ctx = document.getElementById('expensesBreakdownChart').getContext('2d');
                if (breakdownChartInstance) breakdownChartInstance.destroy();
                breakdownChartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            data: data.data,
                            backgroundColor: [
                                '#3B82F6', '#10B981', '#F59E0B', '#EF4444', 
                                '#8B5CF6', '#F97316', '#6B7280', '#EC4899'
                            ],
                            borderWidth: 0,
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                position: 'bottom',
                                labels: {
                                    usePointStyle: true,
                                    padding: 20,
                                    font: { size: 11 }
                                }
                            }
                        },
                        layout: {
                            padding: 20
                        }
                    }
                });
            });
    };
</script>
